services:
  app:
    build: .
    container_name: sae301
    ports:
      - "9001:80"
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_URL=${APP_URL}
      - APP_KEY=${APP_KEY}
      - ENSURE_SSL=false


      # 👇 IMPORTANT : connexion à ta DB locale
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=172.17.0.1
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

    command: >
      sh -c "
      php artisan migrate --force &&
      php artisan storage:link &&
      php artisan config:cache &&
      php artisan cache:clear &&
      php artisan view:clear &&
      apache2-foreground
      "

    volumes:
      - storage:/var/www/html/storage/app/public

    networks:
      - sae301-net

volumes:
  storage:

networks:
  sae301-net:
    driver: bridge
